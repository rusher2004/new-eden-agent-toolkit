name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # go:embed fails at compile time if this hasn't been built yet — every
      # macOS build/test/vet step below depends on it.
      - name: Build macOS URL-scheme handler
        if: runner.os == 'macOS'
        run: make urlscheme-macos-bundle

      # CGO_ENABLED=0 only here: this validates the actual shipped-binary
      # constraint (static, cross-compilable, no CGO dependency). go test
      # -race below needs CGO to build its runtime - that requirement is
      # about how tests run, not what ships, so it doesn't apply there.
      - name: Build
        run: go build ./...
        env:
          CGO_ENABLED: "0"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -v
