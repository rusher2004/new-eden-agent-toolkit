name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The checks below are OS-independent, so they run on ubuntu only.
      # `go fix` is not gated yet: the code has pending fixes (see CLAUDE.md
      # "Go standards"); add it here once they are committed.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files - run 'go fmt ./...' and commit the result:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check generated files are in sync
        if: runner.os == 'Linux'
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain)" ]; then
            echo "generated files are stale - run 'go generate ./...' and commit the result:"
            git diff
            exit 1
          fi

      # GoReleaser runs `go mod tidy` before it builds, so a release from an
      # untidy go.mod/go.sum would ship dependencies no PR ever reviewed.
      - name: Check go.mod and go.sum are tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain)" ]; then
            echo "go.mod/go.sum are not tidy - run 'go mod tidy' and commit the result:"
            git diff
            exit 1
          fi

      # CGO_ENABLED=0 only here: this validates the actual shipped-binary
      # constraint (static, cross-compilable, no CGO dependency). go test
      # -race below needs CGO to build its runtime - that requirement is
      # about how tests run, not what ships, so it doesn't apply there.
      - name: Build
        run: go build ./...
        env:
          CGO_ENABLED: "0"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -v
